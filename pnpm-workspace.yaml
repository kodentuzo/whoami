# Supply chain, written out so a change of pnpm defaults can't quietly weaken them: releases
# install only once they're a day old, provenance can't be downgraded, transitive deps can't come
# from git or tarball URLs, and no package may run install scripts.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true
